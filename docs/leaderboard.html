<style>
:root {

  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --tfm: #2a78d6; --gbdt: #eb6834; --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --tfm: #3987e5; --gbdt: #d95926; --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --tfm: #3987e5; --gbdt: #d95926; --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.top h1 { margin: 0; }
.prefs { display: flex; gap: 8px; }
h2 { font-size: 17px; margin: 0 0 4px; }
p { margin: 4px 0; }
a { color: var(--accent); }
.sub { color: var(--ink-2); }
.muted { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
label.check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
details summary { cursor: pointer; color: var(--ink-2); }
details ul { margin: 8px 0 0; padding-left: 20px; color: var(--ink-2); }
details li { margin: 2px 0; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th .arrow { color: var(--muted); }
th:first-child, td:first-child, th.left, td.left { text-align: left; }
tbody tr:hover { background: var(--wash); }
tr.focus td { background: var(--wash); }
tr.dim td { opacity: 0.45; }
.model { cursor: pointer; }
.model:hover { text-decoration: underline; }
.fam { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.fam.TFM { background: var(--tfm); }
.fam.GBDT { background: var(--gbdt); }
.legend { display: flex; gap: 16px; color: var(--ink-2); font-size: 12px; margin: 8px 0; }
.heat { table-layout: fixed; width: auto; }
.heat td.left { overflow: hidden; text-overflow: ellipsis; }
.heat td.cell { text-align: center; padding: 0; border: 2px solid var(--surface); border-radius: 4px; cursor: pointer; }
.heat td.cell span { display: block; padding: 6px 4px; }
.heat td.cell:hover, .heat td.cell:focus { outline: 2px solid var(--ink); outline-offset: -2px; }
.heat td.empty { color: var(--muted); cursor: default; }
.heat td.mean { cursor: default; font-weight: 700; border-right: 6px solid var(--surface); }
.heat th.col { cursor: pointer; text-align: center; font-weight: 500; white-space: normal; hyphens: auto; overflow-wrap: anywhere; vertical-align: bottom; line-height: 1.25; padding: 6px 1px; font-size: 11px; letter-spacing: -0.2px; }
.heat th.col.on { color: var(--ink); font-weight: 700; }
.heat th.col small { display: block; color: var(--muted); font-weight: 400; }
.heat tbody tr:hover { background: transparent; }
.ramp { display: inline-flex; vertical-align: middle; margin: 0 6px; }
.ramp i { width: 14px; height: 10px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.pills button { border: 1px solid var(--border); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.pills button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg text.lbl { fill: var(--ink-2); font-size: 12px; }
svg text.lbl.best { fill: var(--ink); font-weight: 700; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .hit { fill: transparent; cursor: pointer; }
svg .hit:hover, svg .hit:focus { fill: var(--wash); outline: none; }
svg .dimmed { opacity: 0.25; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; max-width: 300px; }
#tip .v { font-size: 14px; font-weight: 700; }
#tip .k { color: var(--ink-2); }
#tip .row { display: flex; gap: 8px; justify-content: space-between; }
footer { margin-top: 24px; }
</style>
</head>

<main>
  <header class="top">
    <h1 data-t="title"></h1>
    <div class="prefs">
      <div class="seg" id="lang">
        <button data-v="ko" aria-pressed="false" lang="ko">한국어</button><button data-v="en" aria-pressed="false" lang="en">English</button>

      </div>
    </div>
  </header>
  <p class="sub"><span data-t="sub"></span> <span id="date"></span></p>
  <details>
    <summary data-t="howto"></summary>
    <ul id="notes"></ul>
  </details>

  <div class="controls">
    <span class="muted" data-t="family"></span>
    <div class="seg" id="family">
      <button data-v="all" aria-pressed="true" data-t="all"></button><button data-v="TFM" aria-pressed="false">TFM</button><button data-v="GBDT" aria-pressed="false">GBDT</button>
    </div>
    <span class="muted" id="focusNote"></span>
  </div>

  <section class="card">
    <h2 data-t="summary"></h2>
    <p class="muted" data-t="summaryHelp"></p>
    <div class="scroll"><table id="summary"></table></div>
  </section>

  <section class="card">
    <h2 data-t="heat"></h2>
    <p class="muted" data-t="heatHelp"></p>
    <div class="legend"><span><span data-t="low"></span><span class="ramp" id="ramp"></span><span data-t="high"></span></span><span data-t="notRun"></span></div>
    <div class="scroll"><table class="heat" id="heat"></table></div>
  </section>

  <section class="card">
    <h2 data-t="speed"></h2>
    <p class="muted" data-t="speedHelp"></p>
    <div class="controls" style="margin-top:8px">
      <div class="seg" id="speedEnv"></div>
      <span class="legend" style="margin:0"><span><i class="fam TFM"></i>TFM</span><span><i class="fam GBDT"></i>GBDT</span></span>
    </div>
    <p class="muted" id="envNote"></p>
    <div id="scatter"></div>
  </section>

  <section class="card" id="detail">
    <h2 data-t="detail"></h2>
    <div class="pills" id="pills"></div>
    <p id="compMeta" class="sub"></p>
    <div class="controls" style="margin-top:4px">
      <label class="check"><input type="checkbox" id="variants" checked> <span data-t="variants"></span></label>
      <span class="legend" style="margin:0"><span><i class="fam TFM"></i>TFM</span><span><i class="fam GBDT"></i>GBDT</span><span data-t="whisker"></span></span>
    </div>
    <div id="dots"></div>
    <div class="scroll"><table id="comp"></table></div>
  </section>

  <footer class="muted">
    <code>uv run km board</code> <span data-t="madeBy"></span> · <span data-t="data"></span>

  </footer>
</main>

const T = () => I18N[state.lang];
const lbl = r => state.lang === "en" ? r.label_en : r.label;
const envName = e => T().env[e] || e;
const fmtInt = n => n.toLocaleString("en-US");

// ---- 공통 ----
const $ = id => document.getElementById(id);
const SVG = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent, text) {
  const n = tag.startsWith("svg:") ? document.createElementNS(SVG, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (document.documentElement.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const famColor = f => cssVar(f === "GBDT" ? "--gbdt" : "--tfm");
const famOk = f => state.family === "all" || state.family === f;
const num = (v, ref = v) => v == null ? "—" : Math.abs(ref) > 1000 ?  // std 는 ref=CV 로 자릿수 결정 (md 와 같게)
  v.toLocaleString("en-US", { maximumFractionDigits: 1, minimumFractionDigits: 1 }) : v.toFixed(4);
const pct = p => p == null ? "—" : p < 0.1 ? "<0.1%" : p.toFixed(1) + "%";
const fix2 = v => v == null ? "—" : v.toFixed(2);
const fix1 = v => v == null ? "—" : v.toFixed(1);
const int = v => v == null ? "—" : fmtInt(Math.round(v));
const lbRank = r => r.rank == null ? "—" : `${int(r.rank)} / ${int(r.teams)} (${pct(r.top_pct)})`;
const pub = v => v == null ? "—" : Math.abs(v) > 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) : String(+v.toPrecision(5));

// ---- 툴팁 (값을 먼저, 이름은 뒤에. 텍스트는 모두 textContent) ----
const tip = $("tip");
function showTip(evt, title, rows) {
  tip.replaceChildren();
  el("div", { class: "v" }, tip, title);
  for (const [k, v] of rows) { const r = el("div", { class: "row" }, tip); el("span", { class: "k" }, r, k); el("b", {}, r, v); }
  tip.style.display = "block";
  let x, y;
  if (evt.clientX != null && evt.type !== "focus") { x = evt.clientX; y = evt.clientY; }
  else { const b = evt.target.getBoundingClientRect(); x = b.right; y = b.top; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, innerWidth - w - 8) + "px";
  tip.style.top = (y + h + 20 > innerHeight ? y - h - 10 : y + 14) + "px";
}
const hideTip = () => { tip.style.display = "none"; };
function hover(node, fn) {
  node.addEventListener("pointermove", e => fn(e));
  node.addEventListener("focus", e => fn(e));
  node.addEventListener("pointerleave", hideTip);
  node.addEventListener("blur", hideTip);
}
const runTip = (r, c) => [
  [`CV ${c.metric}`, `${num(r.cv)} ± ${num(r.cv_std, r.cv)}`], [T().cfgRank, `${r.cv_rank}`],
  [T().lbScore, pub(r.lb_score)], [T().col.lbRank, lbRank(r)],
  [T().col.time, `${int(r.seconds)}s`], ["s/1K", fix2(r.s_per_1k)], [T().col.env, envName(r.env)]];

// ---- 정렬 가능한 표 ----
function sortTable(table, cols, rows, sort, onSort, rowAttrs) {
  table.replaceChildren();
  const tr = el("tr", {}, el("thead", {}, table));
  for (const c of cols) {
    const th = el("th", { class: (c.sort === false ? "" : "sortable ") + (c.left ? "left" : ""), scope: "col" }, tr, c.name);
    if (c.sort !== false) {
      el("span", { class: "arrow" }, th, sort.key === c.key ? (sort.dir > 0 ? " ▲" : " ▼") : "");
      th.tabIndex = 0;
      const go = () => onSort(sort.key === c.key ? { key: c.key, dir: -sort.dir } : { key: c.key, dir: c.desc ? -1 : 1 });
      th.addEventListener("click", go);
      th.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    }
  }
  const val = (r, k) => { const c = cols.find(c => c.key === k); return c.value ? c.value(r) : r[k]; };
  rows = [...rows].sort((a, b) => {
    const x = val(a, sort.key), y = val(b, sort.key);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sort.dir;
  });
  const tbody = el("tbody", {}, table);
  for (const r of rows) {
    const row = el("tr", rowAttrs ? rowAttrs(r) : {}, tbody);
    for (const c of cols) {
      const td = el("td", { class: c.left ? "left" : "" }, row);
      c.cell ? c.cell(td, r) : (td.textContent = c.fmt ? c.fmt(r[c.key], r) : r[c.key]);
    }
  }
}
function modelCell(td, name, base, family, bold) {
  el("i", { class: "fam " + family }, td);
  const s = el(bold ? "b" : "span", { class: "model", tabindex: 0, title: T().focusTitle }, td, name);
  const go = () => setFocus(state.focus === base ? null : base);
  s.addEventListener("click", go);
  s.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
function focusAttrs(base) {
  return state.focus == null ? {} : { class: state.focus === base ? "focus" : "dim" };
}

// ---- 종합 ----
function renderSummary() {
  const C = T().col;
  const cols = [
    { key: "model", name: C.model, left: true, cell: (td, r) => modelCell(td, r.model, r.model, r.family) },
    { key: "family", name: C.family, left: true },
    { key: "n", name: C.n, desc: true },
    { key: "wins", name: C.wins, desc: true },
    { key: "pct", name: C.pct, fmt: fix2 },
    { key: "lb", name: C.lb, fmt: (v, r) => v == null ? "—" : pct(v) + (r.lb_other ? "*" : "") },
    { key: "s1k", name: C.s1k, fmt: fix2 },
    { key: "s1k_all", name: C.s1k_all, fmt: fix2 },
    { key: "ctx", name: C.ctx, desc: true, fmt: v => v || "" },
  ];
  sortTable($("summary"), cols, SUMMARY.filter(r => famOk(r.family)), state.sumSort,
            s => { state.sumSort = s; renderSummary(); }, r => focusAttrs(r.model));
}

// ---- 히트맵 ----
function renderHeat() {
  const t = $("heat"); t.replaceChildren();
  t.style.width = HEAT_MODEL_COL + HEAT_MEAN_COL + COMPS.length * HEAT_COL + "px";  // table-layout: fixed 라 너비를 정해 둬야 열이 고정됨
  const dark = isDark();
  const best = RUNS.filter(r => r.base_rank != null);
  const n = {}; for (const r of best) n[r.comp] = (n[r.comp] || 0) + 1;
  const cell = {}; for (const r of best) cell[r.comp + "|" + r.base] = r;
  const cg = el("colgroup", {}, t);
  el("col", { style: `width:${HEAT_MODEL_COL}px` }, cg);
  el("col", { style: `width:${HEAT_MEAN_COL}px` }, cg);
  for (const _ of COMPS) el("col", { style: `width:${HEAT_COL}px` }, cg);
  const hr = el("tr", {}, el("thead", {}, t));
  el("th", { class: "left" }, hr, T().col.model);
  el("th", { class: "col", scope: "col" }, hr, T().meanRank);
  for (const c of COMPS) {
    // 긴 대회 이름은 CamelCase 사이 (GiveMe·Some·Credit) 나 영어 하이픈 (Bio-response) 으로 줄바꿈
    const th = el("th", { class: "col" + (state.comp === c.id ? " on" : ""), scope: "col", tabindex: 0, title: c.title, lang: "en" }, hr,
                  (HEAT_BREAK[c.title] || c.title).replace(/([a-z])([A-Z])/g, "$1​$2"));
    el("small", {}, th, c.train ? T().rows(c.train >= 10000 ? Math.round(c.train / 1000) + "K" : fmtInt(c.train)) : "");
    th.addEventListener("click", () => selectComp(c.id, true));
    th.addEventListener("keydown", e => { if (e.key === "Enter") selectComp(c.id, true); });
  }
  // q: 0 = 1위 ~ 1 = 꼴찌 → 진할수록 상위
  const shade = q => {
    const i = dark ? 1 + Math.round(q * 11) : 12 - Math.round(q * 12);
    return `background:${RAMP[i]};color:${(dark ? i <= 5 : i >= 7) ? (dark ? "#0b0b0b" : "#ffffff") : (dark ? "#f0efec" : "#0b0b0b")}`;
  };
  const nModels = Math.max(...Object.values(n));
  const tb = el("tbody", {}, t);
  for (const s of SUMMARY.filter(r => famOk(r.family))) {
    const row = el("tr", focusAttrs(s.model), tb);
    modelCell(el("td", { class: "left" }, row), s.model, s.model, s.family);
    // 평균 순위: 돌린 대회만 평균 (빈 칸이 있는 모델은 대회 수가 달라 직접 비교는 주의 → 툴팁에 대회 수)
    const ranks = COMPS.map(c => cell[c.id + "|" + s.model]).filter(Boolean).map(r => r.base_rank);
    const mean = ranks.reduce((a, b) => a + b, 0) / ranks.length;
    const mtd = el("td", { class: "cell mean", style: shade(nModels > 1 ? (mean - 1) / (nModels - 1) : 0) }, row);
    el("span", {}, mtd, fix1(mean));
    hover(mtd, e => showTip(e, s.model, [[T().meanRank, fix1(mean)], [T().col.n, ranks.length]]));
    for (const c of COMPS) {
      const r = cell[c.id + "|" + s.model];
      if (!r) { el("td", { class: "cell empty" }, row, "·"); continue; }
      const td = el("td", { class: "cell", tabindex: 0, style: shade(n[c.id] > 1 ? (r.base_rank - 1) / (n[c.id] - 1) : 0) }, row);
      el("span", {}, td, r.base_rank);
      hover(td, e => showTip(e, `${lbl(r)} · ${c.title}`, [[T().modelRank, `${r.base_rank} / ${n[c.id]}`], ...runTip(r, c)]));
      td.addEventListener("click", () => selectComp(c.id, true));
    }
  }
  const ramp = $("ramp"); ramp.replaceChildren();
  for (let k = 0; k <= 6; k++) el("i", { style: `background:${RAMP[dark ? 12 - k * 11 / 6 | 0 : k * 2]}` }, ramp);
}

// ---- 산점도: 속도 vs 성능 (환경별 탭) ----
// 종합과 같이 모델마다 대회별 최고 설정 행만 보고, 환경마다 s/1K 중앙값. 로그 축이라 0 이하는 뺌
// DBX H100 (TFM) 과 DBX CPU4 (GBDT) 는 한 탭: 같은 시기 Databricks 실행이고 모델마다 둘 중 하나에서만 돌림
const ENV_TAB = { "DBX H100": "DBX", "DBX CPU4": "DBX" };
const ENV_LABEL = { DBX: "DBX (H100 · CPU4)" };
const ENV_ORDER = ["DBX", "DBX A10G", "Kaggle T4"];
const BEST = RUNS.filter(r => r.base_rank != null && r.s_per_1k > 0).map(r => ({ ...r, tab: ENV_TAB[r.env] || r.env }));
const tabName = e => ENV_LABEL[e] || envName(e);
const ENVS = [...new Set(BEST.map(r => r.tab))].sort((a, b) => (ENV_ORDER.indexOf(a) + 1 || 99) - (ENV_ORDER.indexOf(b) + 1 || 99));
const median = a => { const s = [...a].sort((x, y) => x - y), k = s.length >> 1; return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };
// 중앙값은 그 탭의 모든 모델이 같이 돌린 대회만 (종합 s/1K 와 같은 규칙, board.py common_comps)
const SHARED = Object.fromEntries(ENVS.map(e => {
  const per = SUMMARY.map(s => new Set(BEST.filter(r => r.tab === e && r.base === s.model).map(r => r.comp))).filter(c => c.size);
  return [e, new Set(COMPS.map(c => c.id).filter(id => per.every(c => c.has(id))))];
}));
const SPEED = Object.fromEntries(ENVS.map(e => [e, Object.fromEntries(SUMMARY.flatMap(s => {
  const v = BEST.filter(r => r.tab === e && r.base === s.model && SHARED[e].has(r.comp)).map(r => r.s_per_1k);
  return v.length ? [[s.model, { s1k: median(v), n: v.length }]] : [];
}))]));
const SPEED_LOG = Object.values(SPEED).flatMap(o => Object.values(o).map(x => Math.log10(x.s1k)));
const SX0 = Math.floor(Math.min(...SPEED_LOG)), SX1 = Math.ceil(Math.max(...SPEED_LOG));  // 탭끼리 같은 축
function renderScatter() {
  const box = $("scatter"); box.replaceChildren();
  const shared = COMPS.filter(c => SHARED[state.speed]?.has(c.id)).map(c => c.title);
  $("envNote").textContent = [T().envNote[state.speed], shared.length ? T().envComps(shared) : ""].filter(Boolean).join(" ");
  const sp = SPEED[state.speed] || {};
  const pts = SUMMARY.filter(r => famOk(r.family) && sp[r.model]);
  const W = Math.max(box.clientWidth, 320), H = 320, m = { l: 44, r: 16, t: 12, b: 36 };
  const svg = el("svg:svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": T().scatterAria }, box);
  if (!ENVS.length) return;
  const x0 = SX0, x1 = SX1;
  const X = v => m.l + (Math.log10(v) - x0) / (x1 - x0 || 1) * (W - m.l - m.r);
  const Y = v => m.t + v * (H - m.t - m.b);
  for (let e = x0; e <= x1; e++) {
    el("svg:line", { class: "gridline", x1: X(10 ** e), x2: X(10 ** e), y1: m.t, y2: H - m.b }, svg);
    el("svg:text", { x: X(10 ** e), y: H - m.b + 16, "text-anchor": "middle" }, svg, String(+(10 ** e).toPrecision(3)));
  }
  for (const v of [0, 0.25, 0.5, 0.75, 1]) {
    el("svg:line", { class: "gridline", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }, svg);
    el("svg:text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end" }, svg, v.toFixed(2));
  }
  el("svg:text", { x: W - m.r, y: H - 4, "text-anchor": "end" }, svg, T().logAxis);
  el("svg:text", { x: m.l, y: H - 4 }, svg, T().fast);
  if (!pts.length) el("svg:text", { class: "lbl", x: W / 2, y: H / 2, "text-anchor": "middle" }, svg,
                        SHARED[state.speed]?.size ? T().noRuns : T().noShared);
  const C = T().col;
  // 이름표 자리: 점과 이미 놓은 이름표를 피해 오른쪽 → 왼쪽 → 위 → 아래 → 대각선 순으로, 다 막히면 가장 덜 겹치는 자리
  const placed = pts.map(p => ({ x: X(sp[p.model].s1k) - 7, y: Y(p.pct) - 7, w: 14, h: 14 }));
  const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  for (const p of [...pts].sort((a, b) => sp[a.model].s1k - sp[b.model].s1k)) {
    const g = el("svg:g", { class: state.focus && state.focus !== p.model ? "dimmed" : "" }, svg);
    const cx = X(sp[p.model].s1k), cy = Y(p.pct);
    el("svg:circle", { cx, cy, r: 6, fill: famColor(p.family), stroke: cssVar("--surface"), "stroke-width": 2 }, g);
    const t = el("svg:text", { class: "lbl", y: cy + 4 }, g, p.model);
    const w = t.getComputedTextLength() + 2, h = 14;
    const spots = [[cx + 10, cy - 7], [cx - 10 - w, cy - 7], [cx - w / 2, cy - 23], [cx - w / 2, cy + 9],
                   [cx + 6, cy - 21], [cx + 6, cy + 7], [cx - 6 - w, cy - 21], [cx - 6 - w, cy + 7]]
      .filter(([x, y]) => x >= m.l && x + w <= W - m.r && y >= 0 && y + h <= H - m.b)
      .map(([x, y]) => ({ x, y, w, h }));
    const cost = c => placed.reduce((sum, b) => sum + overlap(c, b), 0);
    const best = spots.find(c => cost(c) === 0) || spots.sort((a, b) => cost(a) - cost(b))[0] || { x: cx + 10, y: cy - 7, w, h };
    t.setAttribute("x", best.x); t.setAttribute("y", best.y + 11);
    placed.push(best);
    const hit = el("svg:circle", { class: "hit", cx, cy, r: 14, tabindex: 0 }, g);
    hover(hit, e => showTip(e, p.model, [[`s/1K (${tabName(state.speed)})`, fix2(sp[p.model].s1k)], [T().envRuns, String(sp[p.model].n)],
                                        [C.pct, fix2(p.pct)], [C.n, String(p.n)], [C.wins, String(p.wins)], [T().bestLb, pct(p.lb)]]));
    hit.addEventListener("click", () => setFocus(state.focus === p.model ? null : p.model));
  }
}

// ---- 대회별 ----
function renderPills() {
  const box = $("pills"); box.replaceChildren();
  for (const c of COMPS) {
    const b = el("button", { "aria-pressed": state.comp === c.id }, box, c.title);
    b.addEventListener("click", () => selectComp(c.id));
  }
}
function compRuns() {
  return RUNS.filter(r => r.comp === state.comp && famOk(r.family) && (state.variants || !r.model.includes("@")));
}
function renderDots() {
  const box = $("dots"); box.replaceChildren();
  const c = compById[state.comp], rows = compRuns().sort((a, b) => a.cv_rank - b.cv_rank);
  if (!rows.length) return;
  const rowH = 26, labelW = 150, m = { t: 8, r: 24, b: 40 };
  const W = Math.max(box.clientWidth, 360), H = m.t + rows.length * rowH + m.b;
  const svg = el("svg:svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": T().dotsAria(c.title) }, box);
  let lo = Math.min(...rows.map(r => r.cv - r.cv_std)), hi = Math.max(...rows.map(r => r.cv + r.cv_std));
  const pad = (hi - lo) * 0.06 || Math.abs(hi) * 0.01 || 1; lo -= pad; hi += pad;
  const X = v => labelW + (v - lo) / (hi - lo) * (W - labelW - m.r);
  const step = niceStep((hi - lo) / Math.max(3, Math.floor((W - labelW) / 110)));
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el("svg:line", { class: "gridline", x1: X(v), x2: X(v), y1: m.t, y2: H - m.b }, svg);
    el("svg:text", { x: X(v), y: H - m.b + 16, "text-anchor": "middle" }, svg, tick(v, step));
  }
  el("svg:text", { x: W - m.r, y: H - 2, "text-anchor": "end" }, svg, `CV ${c.metric} · ${T().better(c.higher)}`);
  rows.forEach((r, i) => {
    const y = m.t + i * rowH + rowH / 2;
    const g = el("svg:g", { class: state.focus && state.focus !== r.base ? "dimmed" : "" }, svg);
    el("svg:text", { class: "lbl" + (r.cv_rank === 1 ? " best" : ""), x: labelW - 10, y: y + 4, "text-anchor": "end" }, g, `${r.cv_rank}. ${lbl(r)}`);
    const col = famColor(r.family);
    el("svg:line", { x1: X(r.cv - r.cv_std), x2: X(r.cv + r.cv_std), y1: y, y2: y, stroke: col, "stroke-width": 2, "stroke-linecap": "round", opacity: 0.55 }, g);
    el("svg:circle", { cx: X(r.cv), cy: y, r: 5, fill: col, stroke: cssVar("--surface"), "stroke-width": 2 }, g);
    const hit = el("svg:rect", { class: "hit", x: 0, y: y - rowH / 2, width: W, height: rowH, tabindex: 0 }, g);
    hover(hit, e => showTip(e, lbl(r), runTip(r, c)));
    hit.addEventListener("click", () => setFocus(state.focus === r.base ? null : r.base));
  });
}
function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
function tick(v, step) {
  const d = Math.max(0, -Math.floor(Math.log10(step)));
  return Math.abs(v) >= 1000 ? fmtInt(Math.round(v)) : v.toFixed(d);
}
function renderCompTable() {
  const c = compById[state.comp], L = T(), C = L.col;
  const lines = [];
  if (c.train) lines.push(L.trainTest(fmtInt(c.train), fmtInt(c.test)));
  lines.push(`${c.metric} ${c.higher ? "↑" : "↓"}`);
  if (c.cap) lines.push(L.cap(fmtInt(c.cap)));
  if (c.basis) lines.push(L.basis[c.basis] || c.basis);
  $("compMeta").textContent = lines.join(" · ");
  const rows = compRuns();
  const top = Math.min(...rows.map(r => r.cv_rank));
  const cols = [
    { key: "cv_rank", name: "#" },
    { key: "label", name: C.model, left: true, value: lbl, cell: (td, r) => modelCell(td, lbl(r), r.base, r.family, r.cv_rank === top) },
    { key: "cv", name: `CV ${c.metric}`, fmt: v => num(v), value: r => c.higher ? -r.cv : r.cv },
    { key: "cv_std", name: "± std", fmt: (v, r) => num(v, r.cv) },
    { key: "lb_score", name: L.lbScore, fmt: pub, value: r => r.lb_score == null ? null : c.higher ? -r.lb_score : r.lb_score },
    { key: "rank", name: C.lbRank, cell: (td, r) => { td.textContent = lbRank(r); } },
    { key: "seconds", name: C.time, fmt: v => int(v) + "s" },
    { key: "s_per_1k", name: "s/1K", fmt: fix2 },
    { key: "env", name: C.env, left: true, fmt: envName },
  ];
  sortTable($("comp"), cols, rows, state.compSort, s => { state.compSort = s; renderCompTable(); }, r => focusAttrs(r.base));
}
function selectComp(id, scroll) {
  state.comp = id;
  syncUrl();
  renderPills(); renderHeat(); renderDots(); renderCompTable();
  if (scroll) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
}
function setFocus(base) {
  state.focus = base;
  renderAll();
}
// URL: ?lang=en#<대회 slug> (공유 링크가 언어·대회를 유지)
function syncUrl() {
  const u = new URL(location.href);
  u.searchParams.set("lang", state.lang);
  u.hash = encodeURIComponent(state.comp);
  try { history.replaceState(null, "", u); } catch (e) { /* file:// 등 */ }
}

// ---- 고정 문구 ----
function renderText() {
  const L = T();
  document.documentElement.lang = state.lang;
  document.title = L.pageTitle;
  for (const n of document.querySelectorAll("[data-t]")) n.textContent = L[n.dataset.t];
  $("theme").title = L.themeTitle;
  $("date").textContent = L.generated(DATA.date);
  const caps = {}; for (const c of COMPS) if (c.cap) (caps[c.cap] = caps[c.cap] || []).push(c.title);
  const capText = "(" + (Object.entries(caps).map(([n, cs]) => `${L.rows(fmtInt(+n))}: ${cs.join(", ")}`).join("; ") || L.none) + ")";
  const ul = $("notes"); ul.replaceChildren();
  for (const h of L.notes) {
    const li = el("li", {}, ul);
    li.innerHTML = h;  // 직접 쓴 문구만 (데이터는 아래 textContent 로)
    for (const s of li.querySelectorAll(".caps")) s.textContent = capText;
    for (const s of li.querySelectorAll(".rerun")) s.textContent = DATA.rerun === "없음" ? L.none : DATA.rerun;
    for (const [cls, cs] of [[".s1kDbx", DATA.s1k_comps.dbx], [".s1kAll", DATA.s1k_comps.all]])
      for (const s of li.querySelectorAll(cls)) s.textContent = L.compList(cs);
  }
  for (const b of $("lang").children) b.setAttribute("aria-pressed", b.dataset.v === state.lang);
  for (const b of $("speedEnv").children) b.textContent = tabName(b.dataset.v);
}

// ---- 컨트롤 ----
function seg(id, onPick) {
  const box = $(id);
  box.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    for (const x of box.children) x.setAttribute("aria-pressed", x === b);
    onPick(b.dataset.v);
  });
}
seg("family", v => { state.family = v; renderAll(); });
for (const e of ENVS) el("button", { "data-v": e, "aria-pressed": false }, $("speedEnv"), tabName(e));
state.speed = ENVS[0];
$("speedEnv").firstChild?.setAttribute("aria-pressed", true);
seg("speedEnv", v => { state.speed = v; renderScatter(); });
function setTheme(v) {
  if (v === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  for (const b of $("theme").children) b.setAttribute("aria-pressed", b.dataset.v === v);
  renderAll();
}
seg("theme", setTheme);
function setLang(v) {
  state.lang = v;
  syncUrl();
  renderAll();
}
seg("lang", setLang);
// 블로그 등에 iframe 으로 넣을 때: 부모가 {kmTheme: "auto"|"light"|"dark"} 나 {kmLang: "ko"|"en"} 를 보내면 따르고, 내용 높이를 {kmHeight} 로 알려 줌
addEventListener("message", e => {
  const d = e.data || {};
  if (["auto", "light", "dark"].includes(d.kmTheme)) setTheme(d.kmTheme);
  if (I18N[d.kmLang] && d.kmLang !== state.lang) setLang(d.kmLang);
});
if (parent !== window) new ResizeObserver(() => parent.postMessage({ kmHeight: document.documentElement.scrollHeight }, "*")).observe(document.body);
$("variants").addEventListener("change", e => { state.variants = e.target.checked; renderDots(); renderCompTable(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderAll());
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { renderScatter(); renderDots(); }, 100); });

function renderAll() {
  renderText();
  $("focusNote").textContent = state.focus ? T().focus(state.focus) : "";
  renderSummary(); renderHeat(); renderScatter(); renderPills(); renderDots(); renderCompTable();
}

// 언어: ?lang= → 브라우저 언어 (ko 가 아니면 en)
const qLang = new URLSearchParams(location.search).get("lang");
state.lang = I18N[qLang] ? qLang : (navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en";
let fromHash = ""; try { fromHash = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* 깨진 해시는 무시 */ }
state.comp = compById[fromHash] ? fromHash : COMPS[COMPS.length - 1].id;
renderAll();
</script>
</body>
